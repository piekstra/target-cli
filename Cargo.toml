[package]
name = "target-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Search and look up Target products via the public RedSky API — JSON output, agent-friendly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/target-cli"
homepage = "https://github.com/piekstra/baby-registry"
readme = "README.md"
keywords = ["target", "redsky", "shopping", "cli", "products"]
categories = ["command-line-utilities"]

[[bin]]
name = "tgt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
